<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>机构三维仿真</title>
  <style>
    :root {
      --bg: #f3f6fa;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #d8e0ea;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2b6cff;
      --accent-2: #12a57a;
      --accent-3: #ea8c1f;
      --danger: #d64545;
      --shadow: 0 1px 0 rgba(15, 23, 42, 0.02);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 0;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: linear-gradient(180deg, #fbfcfe 0%, #f3f6fa 100%);
      border-bottom: 1px solid var(--line);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 6px;
      height: 32px;
      min-width: 32px;
      padding: 0 10px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    button:hover {
      border-color: #bfd0e6;
      background: #fbfdff;
    }

    button.icon {
      width: 34px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 15px;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 330px;
      gap: 0;
    }

    .panel {
      min-width: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      overflow: auto;
    }

    .panel.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .section {
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .section:last-child {
      border-bottom: 0;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .axis-row {
      display: grid;
      grid-template-columns: 44px 1fr 66px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .axis-row label {
      font-size: 13px;
      color: var(--text);
    }

    .axis-row input[type="range"] {
      width: 100%;
    }

    .axis-row input[type="number"] {
      width: 66px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 7px;
      background: var(--panel-2);
      color: var(--text);
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: var(--text);
      font-size: 13px;
    }

    .toggle input {
      margin: 0;
    }

    .stat-grid {
      display: grid;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    .stat {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fcfdff;
    }

    .stat .label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .stat .value {
      font-size: 13px;
      word-break: break-word;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      background: #f8fbff;
      font-variant-numeric: tabular-nums;
    }

    .badge.ok {
      border-color: rgba(18, 165, 122, 0.25);
      background: rgba(18, 165, 122, 0.08);
      color: #0f7a5c;
    }

    .badge.warn {
      border-color: rgba(214, 69, 69, 0.25);
      background: rgba(214, 69, 69, 0.08);
      color: #b43232;
    }

    .solutions {
      display: grid;
      gap: 6px;
      font-variant-numeric: tabular-nums;
    }

    .solution-row {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .solution-row:hover {
      border-color: #bfd0e6;
      background: #fbfdff;
    }

    .solution-row.active {
      border-color: rgba(43, 108, 255, 0.35);
      background: rgba(43, 108, 255, 0.06);
    }

    .solution-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .solution-bottom {
      font-size: 12px;
      color: var(--text);
      word-break: break-word;
    }

    .joint-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .joint-table th,
    .joint-table td {
      padding: 6px 3px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    .joint-table th {
      color: var(--muted);
      font-weight: 600;
    }

    .joint-table th:first-child,
    .joint-table td:first-child {
      width: 34px;
      text-align: left;
    }

    .joint-table tr:last-child td {
      border-bottom: 0;
    }

    .stage {
      min-width: 0;
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2)),
        radial-gradient(circle at top left, rgba(43,108,255,0.05), transparent 32%);
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: transparent;
    }

    .overlay {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      box-shadow: var(--shadow);
      max-width: min(440px, calc(100% - 24px));
    }

    .overlay .line {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }

    .overlay .line:first-child {
      margin-top: 0;
    }

    .k {
      color: var(--muted);
    }

    .v {
      color: var(--text);
    }

    @media (max-width: 1100px) {
      html, body {
        overflow: auto;
      }

      body {
        overflow: auto;
      }

      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(52vh, 1fr) auto;
      }

      .panel.right {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .panel {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .stage {
        min-height: 52vh;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">机构三维仿真</div>
      <div class="toolbar">
        <button class="icon" id="btnHome" title="回零">⌂</button>
        <button class="icon" id="btnSample" title="示例姿态">◎</button>
        <button class="icon" id="btnResetView" title="重置视角">⟲</button>
        <button class="icon" id="btnFit" title="居中">⌖</button>
      </div>
    </div>

    <div class="workspace">
      <aside class="panel">
        <div class="section">
          <div class="section-title">RPY 输入</div>
          <div class="axis-row">
            <label for="yawRange">yaw</label>
            <input id="yawRange" type="range" min="-180" max="180" step="0.1">
            <input id="yawNum" type="number" min="-180" max="180" step="0.1">
          </div>
          <div class="axis-row">
            <label for="pitchRange">pitch</label>
            <input id="pitchRange" type="range" min="-180" max="180" step="0.1">
            <input id="pitchNum" type="number" min="-180" max="180" step="0.1">
          </div>
          <div class="axis-row">
            <label for="rollRange">roll</label>
            <input id="rollRange" type="range" min="-180" max="180" step="0.1">
            <input id="rollNum" type="number" min="-180" max="180" step="0.1">
          </div>
          <label class="toggle"><input id="lockMode" type="checkbox" checked> 锁定工作模态</label>
        </div>

        <div class="section">
          <div class="section-title">视图</div>
          <label class="toggle"><input id="showGrid" type="checkbox" checked> 显示网格</label>
          <label class="toggle"><input id="showLabels" type="checkbox" checked> 显示标注</label>
        </div>

        <div class="section">
          <div class="section-title">几何</div>
          <div class="stat-grid">
            <div class="stat">
              <div class="label">w0_list</div>
              <div class="value" id="w0Text"></div>
            </div>
            <div class="stat">
              <div class="label">v0_list</div>
              <div class="value" id="v0Text"></div>
            </div>
            <div class="stat">
              <div class="label">初始夹角 α</div>
              <div class="value" id="alphaText"></div>
            </div>
          </div>
        </div>
      </aside>

      <main class="stage">
        <canvas id="scene"></canvas>
        <div class="overlay" id="overlay">
          <div class="line"><span class="k">工作模态</span><span class="v" id="modeText">-</span></div>
          <div class="line"><span class="k">θ</span><span class="v" id="thetaText">-</span></div>
          <div class="line"><span class="k">最大残差</span><span class="v" id="maxResidualText">-</span></div>
        </div>
      </main>

      <aside class="panel right">
        <div class="section">
          <div class="section-title">当前结果</div>
          <div class="stat-grid">
            <div class="stat">
              <div class="label">选中解</div>
              <div class="value" id="selectedModeText">-</div>
            </div>
            <div class="stat">
              <div class="label">θ 向量</div>
              <div class="value" id="selectedThetaText">-</div>
            </div>
            <div class="stat">
              <div class="label">残差</div>
              <div class="value" id="selectedResidualText">-</div>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">转角几何复核</div>
          <table class="joint-table">
            <thead>
              <tr>
                <th>支链</th>
                <th>解算 θ</th>
                <th>实转 θ</th>
                <th>α 实测</th>
                <th>θ 差</th>
              </tr>
            </thead>
            <tbody id="rotationVerificationBody"></tbody>
          </table>
        </div>

        <div class="section">
          <div class="section-title">全部解</div>
          <div id="solutionList" class="solutions"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const DEG = Math.PI / 180;
    const SQRT3 = Math.sqrt(3);
    const EPS = 1e-12;

    // 直接对应 solve.py 里的初始向量，改这里就能换机构几何
    const w0Raw = [
      [1, 0, -1],
      [-0.5, SQRT3 / 2, -1],
      [-0.5, -SQRT3 / 2, -1]
    ];

    const v0Raw = [
      [0.00, -1, 0.0],
      [SQRT3 / 2, 0.5, 0.0],
      [-SQRT3 / 2, 0.5, 0.0]
    ];

    const defaultPose = { yaw: 20, pitch: 19, roll: 32 };

    const state = {
      yaw: defaultPose.yaw,
      pitch: defaultPose.pitch,
      roll: defaultPose.roll,
      showGrid: true,
      showLabels: true,
      lockMode: true,
      lockedMode: null,
      prevTheta: [0, 0, 0],
      cameraAzimuth: 35 * DEG,
      cameraElevation: 22 * DEG,
      cameraDistance: 6.8
    };

    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");

    const yawRange = document.getElementById("yawRange");
    const pitchRange = document.getElementById("pitchRange");
    const rollRange = document.getElementById("rollRange");
    const yawNum = document.getElementById("yawNum");
    const pitchNum = document.getElementById("pitchNum");
    const rollNum = document.getElementById("rollNum");
    const lockMode = document.getElementById("lockMode");
    const showGrid = document.getElementById("showGrid");
    const showLabels = document.getElementById("showLabels");

    const w0Text = document.getElementById("w0Text");
    const v0Text = document.getElementById("v0Text");
    const alphaText = document.getElementById("alphaText");
    const modeText = document.getElementById("modeText");
    const thetaText = document.getElementById("thetaText");
    const maxResidualText = document.getElementById("maxResidualText");
    const selectedModeText = document.getElementById("selectedModeText");
    const selectedThetaText = document.getElementById("selectedThetaText");
    const selectedResidualText = document.getElementById("selectedResidualText");
    const rotationVerificationBody = document.getElementById("rotationVerificationBody");
    const solutionList = document.getElementById("solutionList");

    const normalizedW0 = w0Raw.map(normalize);
    const normalizedV0 = v0Raw.map(normalize);
    const alphaList = normalizedW0.map((w, i) => {
      const c = clamp(dot(w, normalizedV0[i]), -1, 1);
      return Math.acos(c);
    });

    let currentSolutions = [];
    let selectedSolution = null;
    let currentError = null;

    function vec3(x, y, z) {
      return [x, y, z];
    }

    function clone(v) {
      return [v[0], v[1], v[2]];
    }

    function add(a, b) {
      return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
    }

    function sub(a, b) {
      return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    }

    function scale(v, s) {
      return [v[0] * s, v[1] * s, v[2] * s];
    }

    function dot(a, b) {
      return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
      ];
    }

    function norm(v) {
      return Math.hypot(v[0], v[1], v[2]);
    }

    function normalize(v) {
      const n = norm(v);
      if (n < EPS) {
        throw new Error("向量长度接近 0");
      }
      return [v[0] / n, v[1] / n, v[2] / n];
    }

    function clamp(x, lo, hi) {
      return Math.max(lo, Math.min(hi, x));
    }

    function deg2rad(a) {
      return a * DEG;
    }

    function rad2deg(a) {
      return a / DEG;
    }

    function rotX(a) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      return [
        [1, 0, 0],
        [0, c, -s],
        [0, s, c]
      ];
    }

    function rotY(a) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      return [
        [c, 0, s],
        [0, 1, 0],
        [-s, 0, c]
      ];
    }

    function rotZ(a) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      return [
        [c, -s, 0],
        [s, c, 0],
        [0, 0, 1]
      ];
    }

    function matMul(A, B) {
      const C = Array.from({ length: 3 }, () => [0, 0, 0]);
      for (let i = 0; i < 3; i++) {
        for (let j = 0; j < 3; j++) {
          let s = 0;
          for (let k = 0; k < 3; k++) {
            s += A[i][k] * B[k][j];
          }
          C[i][j] = s;
        }
      }
      return C;
    }

    function matVec(M, v) {
      return [
        M[0][0] * v[0] + M[0][1] * v[1] + M[0][2] * v[2],
        M[1][0] * v[0] + M[1][1] * v[1] + M[1][2] * v[2],
        M[2][0] * v[0] + M[2][1] * v[1] + M[2][2] * v[2]
      ];
    }

    function rpyToR(yaw, pitch, roll, degrees = true) {
      if (degrees) {
        yaw = deg2rad(yaw);
        pitch = deg2rad(pitch);
        roll = deg2rad(roll);
      }
      return matMul(matMul(rotZ(yaw), rotY(pitch)), rotX(roll));
    }

    function wrapToPi(angle) {
      return ((angle + Math.PI) % (2 * Math.PI)) - Math.PI;
    }

    function wrapTo180(angle) {
      return ((angle + 180) % 360) - 180;
    }

    function unwrapToReference(theta, reference, degrees = true) {
      return reference.map((r, i) => {
        const d = theta[i] - r;
        return degrees ? r + wrapTo180(d) : r + wrapToPi(d);
      });
    }

    function solveThetaCandidatesSingle(w0, v0, yaw, pitch, roll, alpha = null, degrees = true) {
      const w = normalize(w0);
      const v0n = normalize(v0);
      let cosAlpha;

      if (alpha === null || alpha === undefined) {
        cosAlpha = dot(w, v0n);
      } else {
        if (degrees) {
          alpha = deg2rad(alpha);
        }
        cosAlpha = Math.cos(alpha);
      }

      cosAlpha = clamp(cosAlpha, -1, 1);

      const R = rpyToR(yaw, pitch, roll, degrees);
      const v = matVec(R, v0n);

      const wx = w[0], wy = w[1], wz = w[2];
      const vx = v[0], vy = v[1], vz = v[2];

      const A = wx * vx + wy * vy;
      const B = wx * vy - wy * vx;
      const C = cosAlpha - wz * vz;
      const rho = Math.hypot(A, B);

      if (rho < EPS) {
        throw new Error("rho 太小，该姿态下 theta 无法稳定求解");
      }

      let q = C / rho;
      if (Math.abs(q) > 1 + 1e-10) {
        throw new Error("无解，姿态可能超出工作空间");
      }

      q = clamp(q, -1, 1);
      const phi = Math.atan2(B, A);
      const delta = Math.acos(q);

      let thetaPlus = wrapToPi(phi + delta);
      let thetaMinus = wrapToPi(phi - delta);

      if (degrees) {
        thetaPlus = rad2deg(thetaPlus);
        thetaMinus = rad2deg(thetaMinus);
      }

      return [
        { theta: thetaPlus, mode: +1 },
        { theta: thetaMinus, mode: -1 }
      ];
    }

    function inverseKinematicsAllSolutionsWithModes(w0List, v0List, yaw, pitch, roll, alphaList = null, degrees = true) {
      const candidatesByLeg = [];
      for (let i = 0; i < w0List.length; i++) {
        candidatesByLeg.push(
          solveThetaCandidatesSingle(
            w0List[i],
            v0List[i],
            yaw,
            pitch,
            roll,
            alphaList ? alphaList[i] : null,
            degrees
          )
        );
      }

      const results = [];

      function walk(idx, chosen) {
        if (idx === candidatesByLeg.length) {
          results.push({
            theta: chosen.map((x) => x.theta),
            workingMode: chosen.map((x) => x.mode)
          });
          return;
        }

        for (const cand of candidatesByLeg[idx]) {
          chosen.push(cand);
          walk(idx + 1, chosen);
          chosen.pop();
        }
      }

      walk(0, []);
      return results;
    }

    function chooseSolutionClosestToReference(allSolutions, referenceTheta, degrees = true) {
      let best = null;
      let bestCost = Infinity;

      for (const sol of allSolutions) {
        const theta = unwrapToReference(sol.theta, referenceTheta, degrees);
        let cost = 0;
        for (let i = 0; i < theta.length; i++) {
          const d = theta[i] - referenceTheta[i];
          cost += d * d;
        }
        cost = Math.sqrt(cost);

        if (cost < bestCost) {
          bestCost = cost;
          best = {
            theta,
            workingMode: sol.workingMode,
            cost
          };
        }
      }

      return best;
    }

    function chooseSolutionByWorkingMode(allSolutions, workingMode, referenceTheta = null, degrees = true) {
      const target = workingMode.join(",");
      const match = allSolutions.find((sol) => sol.workingMode.join(",") === target);

      if (!match) {
        throw new Error(`没有找到 working_mode = ${workingMode.join(",")}`);
      }

      const theta = referenceTheta ? unwrapToReference(match.theta, referenceTheta, degrees) : match.theta.slice();
      return {
        theta,
        workingMode: match.workingMode.slice()
      };
    }

    function modeString(mode) {
      return `(${mode.map((m) => (m > 0 ? "+1" : "-1")).join(", ")})`;
    }

    function thetaString(theta, digits = 2) {
      return `[${theta.map((v) => formatFixed(v, digits)).join(", ")}]°`;
    }

    function formatFixed(v, digits = 2) {
      if (!Number.isFinite(v)) return "NaN";
      return Number(v).toFixed(digits);
    }

    function formatSci(v, digits = 3) {
      if (!Number.isFinite(v)) return "NaN";
      return Number(v).toExponential(digits);
    }

    function formatVec(v, digits = 3) {
      return `[${v.map((x) => formatFixed(x, digits)).join(", ")}]`;
    }

    function residualsForSolution(solution, yaw, pitch, roll) {
      const R = rpyToR(yaw, pitch, roll, true);
      return normalizedW0.map((w0, i) => {
        const theta = deg2rad(solution.theta[i]);
        const w = matVec(rotZ(theta), w0);
        const v = matVec(R, normalizedV0[i]);
        const c = dot(w, v);
        return {
          dot: c,
          residual: c - Math.cos(alphaList[i]),
          angle: Math.acos(clamp(c, -1, 1)) / DEG
        };
      });
    }

    function rotationVerificationForSolution(solution, yaw, pitch, roll) {
      const R = rpyToR(yaw, pitch, roll, true);

      return normalizedW0.map((w0, i) => {
        const thetaSolved = solution.theta[i];
        const w = matVec(rotZ(deg2rad(thetaSolved)), w0);
        const v = matVec(R, normalizedV0[i]);

        const crossZ = w0[0] * w[1] - w0[1] * w[0];
        const dotXY = w0[0] * w[0] + w0[1] * w[1];
        const thetaMeasuredRaw = rad2deg(Math.atan2(crossZ, dotXY));
        const thetaMeasured = thetaSolved + wrapTo180(thetaMeasuredRaw - thetaSolved);
        const alphaMeasured = rad2deg(Math.acos(clamp(dot(w, v), -1, 1)));

        return {
          index: i + 1,
          thetaSolved,
          thetaMeasured,
          alphaMeasured,
          thetaError: wrapTo180(thetaMeasured - thetaSolved),
          alphaError: alphaMeasured - rad2deg(alphaList[i])
        };
      });
    }

    function renderRotationVerification(rows) {
      rotationVerificationBody.innerHTML = "";

      if (!rows) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.textContent = "无解";
        tr.appendChild(td);
        rotationVerificationBody.appendChild(tr);
        return;
      }

      for (const row of rows) {
        const tr = document.createElement("tr");
        const values = [
          `L${row.index}`,
          `${formatFixed(row.thetaSolved, 2)}°`,
          `${formatFixed(row.thetaMeasured, 2)}°`,
          `${formatFixed(row.alphaMeasured, 2)}°`,
          `${formatSci(row.thetaError, 1)}°`
        ];

        for (const value of values) {
          const td = document.createElement("td");
          td.textContent = value;
          tr.appendChild(td);
        }
        rotationVerificationBody.appendChild(tr);
      }
    }

    function sphereCenter() {
      // solve.py 的姿态模型是球面机构：所有方向向量都以 O 为共同球心。
      return vec3(0, 0, 0);
    }

    function platformAxes(R) {
      const c = sphereCenter();
      const s = 0.72;
      return [
        { a: c, b: add(c, scale(matVec(R, [1, 0, 0]), s)), color: "#2b6cff", width: 2, arrow: true },
        { a: c, b: add(c, scale(matVec(R, [0, 1, 0]), s)), color: "#12a57a", width: 2, arrow: true },
        { a: c, b: add(c, scale(matVec(R, [0, 0, 1]), s)), color: "#ea8c1f", width: 2, arrow: true }
      ];
    }

    function worldAxes() {
      const o = vec3(0, 0, 0);
      const s = 1.4;
      return [
        { a: o, b: vec3(s, 0, 0), color: "#d64545", width: 2.5, arrow: true },
        { a: o, b: vec3(0, s, 0), color: "#12a57a", width: 2.5, arrow: true },
        { a: o, b: vec3(0, 0, s), color: "#2b6cff", width: 2.5, arrow: true }
      ];
    }

    function gridLines() {
      const lines = [];
      const z = -1.55;
      const span = 3.5;
      const step = 0.5;
      for (let x = -span; x <= span + 1e-9; x += step) {
        lines.push({ a: vec3(x, -span, z), b: vec3(x, span, z), color: "#e7ebf1", width: 1 });
      }
      for (let y = -span; y <= span + 1e-9; y += step) {
        lines.push({ a: vec3(-span, y, z), b: vec3(span, y, z), color: "#e7ebf1", width: 1 });
      }
      return lines;
    }

    function addRod(items, a, b, color, width = 7, casing = "#263447", casingWidth = width + 4) {
      items.push({
        a,
        b,
        color,
        width,
        casing,
        casingWidth,
        lineCap: "round"
      });
    }

    function sphericalPoint(a, b, t, radius) {
      const na = normalize(a);
      const nb = normalize(b);
      const omega = Math.acos(clamp(dot(na, nb), -1, 1));

      if (omega < 1e-8) {
        return scale(na, radius);
      }

      const s = Math.sin(omega);
      return scale(
        add(
          scale(na, Math.sin((1 - t) * omega) / s),
          scale(nb, Math.sin(t * omega) / s)
        ),
        radius
      );
    }

    function addSphericalRod(items, a, b, color, radius, width = 8) {
      const steps = 16;
      let previous = scale(normalize(a), radius);

      for (let j = 1; j <= steps; j++) {
        const next = sphericalPoint(a, b, j / steps, radius);
        addRod(items, previous, next, color, width, "#263447", width + 5);
        previous = next;
      }
    }

    function buildScene() {
      const R = rpyToR(state.yaw, state.pitch, state.roll, true);
      const c = sphereCenter();
      const legColors = ["#2b6cff", "#12a57a", "#ea8c1f"];
      const items = [];
      const surfaces = [];

      if (state.showGrid) {
        items.push(...gridLines());
      }

      items.push(...worldAxes());

      const wPts = [];
      const vPts = [];
      const directionRadius = 1.65;
      const u = vec3(0, 0, -1);
      const uPoint = scale(u, directionRadius);

      // 三个输入副共用 Z 轴，用一根中心轴和三个同心关节圈表示。
      addRod(items, vec3(0, 0, -2.15), vec3(0, 0, 0.45), "#64748b", 7, "#263447", 11);

      for (let i = 0; i < 3; i++) {
        const theta = deg2rad(selectedSolution.theta[i]);
        const w = matVec(rotZ(theta), normalizedW0[i]);
        const v = matVec(R, normalizedV0[i]);
        const wPoint = scale(w, directionRadius);
        const vPoint = scale(v, directionRadius);

        wPts.push(wPoint);
        vPts.push(vPoint);

        // 第一连杆：公共输入轴 u 到中间转动副 w_i。
        addSphericalRod(items, u, w, legColors[i], directionRadius, 8);

        // 第二连杆：中间转动副 w_i 到动平台转动副 v_i。
        addSphericalRod(items, w, v, legColors[i], directionRadius, 9);

        // 细虚线只显示 solve.py 中使用的方向向量。
        items.push({ a: c, b: wPoint, color: legColors[i], width: 1.5, dash: [6, 5] });
        items.push({ a: c, b: vPoint, color: legColors[i], width: 1.5, dash: [6, 5] });
      }

      // v1、v2、v3 就是动平台上的三个点。
      surfaces.push({
        points: vPts,
        fill: "rgba(55, 142, 119, 0.30)",
        stroke: "#236c5a",
        width: 3
      });

      for (let i = 0; i < 3; i++) {
        addRod(
          items,
          vPts[i],
          vPts[(i + 1) % 3],
          "#4f9e88",
          5,
          "#174f43",
          9
        );
      }

      items.push(...platformAxes(R));

      const points = [];
      // 三个同轴输入副画成同一位置的三层同心环。
      points.push({ p: uPoint, color: "#2b6cff", stroke: "#263447", strokeWidth: 3, r: 12 });
      points.push({ p: uPoint, color: "#12a57a", stroke: "#ffffff", strokeWidth: 2, r: 8.5 });
      points.push({ p: uPoint, color: "#ea8c1f", stroke: "#ffffff", strokeWidth: 2, r: 5 });
      for (let i = 0; i < 3; i++) {
        points.push({ p: wPts[i], color: legColors[i], stroke: "#263447", strokeWidth: 3, r: 7 });
        points.push({ p: vPts[i], color: "#ffffff", stroke: legColors[i], strokeWidth: 3, r: 7 });
      }
      points.push({ p: c, color: "#ffffff", stroke: "#263447", strokeWidth: 3, r: 7 });

      const labels = [];
      if (state.showLabels) {
        const axisLen = 1.55;
        labels.push({ p: vec3(axisLen, 0, 0), text: "X", color: "#d64545" });
        labels.push({ p: vec3(0, axisLen, 0), text: "Y", color: "#12a57a" });
        labels.push({ p: vec3(0, 0, axisLen), text: "Z", color: "#2b6cff" });
        for (let i = 0; i < 3; i++) {
          labels.push({ p: wPts[i], text: `w${i + 1}`, color: legColors[i] });
          labels.push({ p: vPts[i], text: `v${i + 1}`, color: legColors[i] });
        }
        labels.push({ p: uPoint, text: "同轴输入 θ1 / θ2 / θ3", color: "#334155" });
        labels.push({ p: add(c, scale(matVec(R, [0, 0, 1]), 0.28)), text: "动平台", color: "#236c5a" });
        labels.push({ p: c, text: "O", color: "#111827" });
      }

      return { items, surfaces, points, labels, center: c };
    }

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.floor(rect.width * dpr));
      const height = Math.max(1, Math.floor(rect.height * dpr));

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
    }

    function projectPoint(p) {
      const center = sphereCenter();
      const target = add(center, vec3(0, 0, -0.2));

      const az = state.cameraAzimuth;
      const el = clamp(state.cameraElevation, -1.45, 1.45);
      const cosEl = Math.cos(el);
      const camPos = add(target, vec3(
        state.cameraDistance * cosEl * Math.cos(az),
        state.cameraDistance * cosEl * Math.sin(az),
        state.cameraDistance * Math.sin(el)
      ));

      const forward = normalize(sub(target, camPos));
      const worldUp = [0, 0, 1];
      let right = cross(forward, worldUp);
      if (norm(right) < EPS) {
        right = [1, 0, 0];
      } else {
        right = normalize(right);
      }
      const up = cross(right, forward);

      const relCam = sub(p, camPos);
      const x = dot(relCam, right);
      const y = dot(relCam, up);
      const z = dot(relCam, forward);

      return { x, y, z };
    }

    function segmentToScreen(a, b) {
      const pa = projectPoint(a);
      const pb = projectPoint(b);
      const sa = worldToScreen(a);
      const sb = worldToScreen(b);

      return {
        // projectPoint() 返回相机坐标，Canvas 需要的是像素坐标。
        // 之前线段直接使用了 pa/pb 的 x、y，导致连杆被画在左上角的几个像素内。
        a: sa,
        b: sb,
        depth: (pa.z + pb.z) * 0.5
      };
    }

    function worldToScreen(p) {
      const rect = canvas.getBoundingClientRect();
      const focal = Math.min(rect.width, rect.height) * 0.95;
      const proj = projectPoint(p);
      const z = Math.max(0.25, proj.z);
      return {
        x: rect.width / 2 + (proj.x / z) * focal,
        y: rect.height / 2 - (proj.y / z) * focal,
        z,
        visible: proj.z > 0
      };
    }

    function drawArrowHead(x1, y1, x2, y2, color, size = 8) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const a1 = angle + Math.PI - 0.35;
      const a2 = angle + Math.PI + 0.35;

      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 + Math.cos(a1) * size, y2 + Math.sin(a1) * size);
      ctx.lineTo(x2 + Math.cos(a2) * size, y2 + Math.sin(a2) * size);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function render() {
      resizeCanvas();

      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);

      const scene = buildScene();
      const segments = [];

      for (const item of scene.items) {
        segments.push({
          ...segmentToScreen(item.a, item.b),
          color: item.color,
          width: item.width,
          casing: item.casing || null,
          casingWidth: item.casingWidth || 0,
          lineCap: item.lineCap || "butt",
          dash: item.dash || null,
          arrow: item.arrow || false
        });
      }

      segments.sort((a, b) => b.depth - a.depth);

      for (const seg of segments) {
        if (!Number.isFinite(seg.a.x) || !Number.isFinite(seg.b.x)) continue;
        if (seg.a.visible === false || seg.b.visible === false) continue;
        if (seg.a.z <= 0 || seg.b.z <= 0) continue;

        if (seg.casing) {
          ctx.beginPath();
          ctx.setLineDash([]);
          ctx.lineCap = seg.lineCap;
          ctx.lineWidth = seg.casingWidth;
          ctx.strokeStyle = seg.casing;
          ctx.moveTo(seg.a.x, seg.a.y);
          ctx.lineTo(seg.b.x, seg.b.y);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.setLineDash(seg.dash || []);
        ctx.lineCap = seg.lineCap;
        ctx.lineWidth = seg.width;
        ctx.strokeStyle = seg.color;
        ctx.moveTo(seg.a.x, seg.a.y);
        ctx.lineTo(seg.b.x, seg.b.y);
        ctx.stroke();
        ctx.setLineDash([]);
        if (seg.arrow) {
          drawArrowHead(seg.a.x, seg.a.y, seg.b.x, seg.b.y, seg.color, 7);
        }
      }

      for (const surface of scene.surfaces) {
        const projected = surface.points.map(worldToScreen);
        if (projected.some((p) => !p.visible)) continue;

        ctx.beginPath();
        ctx.moveTo(projected[0].x, projected[0].y);
        for (let i = 1; i < projected.length; i++) {
          ctx.lineTo(projected[i].x, projected[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = surface.fill;
        ctx.fill();
        ctx.lineJoin = "round";
        ctx.lineWidth = surface.width;
        ctx.strokeStyle = surface.stroke;
        ctx.stroke();
      }

      for (const p of scene.points) {
        const s = worldToScreen(p.p);
        if (!s.visible) continue;
        ctx.beginPath();
        ctx.arc(s.x, s.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = p.stroke || "#ffffff";
        ctx.lineWidth = p.strokeWidth || 1;
        ctx.stroke();
      }

      if (state.showLabels) {
        ctx.font = "12px Segoe UI, Microsoft YaHei, sans-serif";
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        for (const label of scene.labels) {
          const s = worldToScreen(label.p);
          if (!s.visible) continue;
          ctx.fillStyle = "#111827";
          ctx.fillText(label.text, s.x + 6, s.y - 6);
        }
      }

      ctx.restore();
    }

    function solutionResidualSummary(sol) {
      const rs = residualsForSolution(sol, state.yaw, state.pitch, state.roll);
      return rs.map((r, i) => `r${i + 1}=${formatSci(r.residual, 2)}`).join("  ");
    }

    function updateInfoPanels() {
      if (currentError) {
        const alphaDeg = alphaList.map((a) => formatFixed(a / DEG, 2)).join("°, ") + "°";
        modeText.textContent = "无解";
        thetaText.textContent = currentError;
        maxResidualText.textContent = "无解";
        selectedModeText.textContent = "无解";
        selectedThetaText.textContent = "无解";
        selectedResidualText.textContent = currentError;
        alphaText.textContent = alphaDeg;
        w0Text.textContent = w0Raw.map((v) => formatVec(v, 3)).join("  ");
        v0Text.textContent = v0Raw.map((v) => formatVec(v, 3)).join("  ");
        renderRotationVerification(null);
        return;
      }

      const rs = residualsForSolution(selectedSolution, state.yaw, state.pitch, state.roll);
      const maxResidual = Math.max(...rs.map((r) => Math.abs(r.residual)));

      modeText.textContent = modeString(selectedSolution.workingMode);
      thetaText.textContent = thetaString(selectedSolution.theta, 2);
      maxResidualText.textContent = formatSci(maxResidual, 2);

      selectedModeText.textContent = modeString(selectedSolution.workingMode);
      selectedThetaText.textContent = thetaString(selectedSolution.theta, 2);
      selectedResidualText.textContent = rs.map((r, i) => `r${i + 1}=${formatSci(r.residual, 2)}`).join("  ");

      const alphaDeg = alphaList.map((a) => formatFixed(a / DEG, 2)).join("°, ") + "°";
      alphaText.textContent = alphaDeg;
      w0Text.textContent = w0Raw.map((v) => formatVec(v, 3)).join("  ");
      v0Text.textContent = v0Raw.map((v) => formatVec(v, 3)).join("  ");
      renderRotationVerification(
        rotationVerificationForSolution(selectedSolution, state.yaw, state.pitch, state.roll)
      );
    }

    function renderSolutionList() {
      solutionList.innerHTML = "";

      if (currentError) {
        const empty = document.createElement("div");
        empty.className = "stat";
        empty.textContent = currentError;
        solutionList.appendChild(empty);
        return;
      }

      currentSolutions.forEach((sol) => {
        const row = document.createElement("div");
        row.className = "solution-row";
        if (arraysEqual(sol.workingMode, selectedSolution.workingMode)) {
          row.classList.add("active");
        }

        const top = document.createElement("div");
        top.className = "solution-top";

        const left = document.createElement("span");
        left.textContent = modeString(sol.workingMode);

        const right = document.createElement("span");
        right.textContent = solutionResidualSummary(sol);

        const bottom = document.createElement("div");
        bottom.className = "solution-bottom";
        bottom.textContent = thetaString(sol.theta, 2);

        top.appendChild(left);
        top.appendChild(right);
        row.appendChild(top);
        row.appendChild(bottom);

        row.addEventListener("click", () => {
          state.lockMode = true;
          lockMode.checked = true;
          state.lockedMode = sol.workingMode.slice();
          recalc();
        });

        solutionList.appendChild(row);
      });
    }

    function arraysEqual(a, b) {
      if (!a || !b || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (a[i] !== b[i]) return false;
      }
      return true;
    }

    function recalc() {
      currentError = null;
      state.showGrid = showGrid.checked;
      state.showLabels = showLabels.checked;
      state.lockMode = lockMode.checked;

      try {
        currentSolutions = inverseKinematicsAllSolutionsWithModes(
          normalizedW0,
          normalizedV0,
          state.yaw,
          state.pitch,
          state.roll,
          null,
          true
        );

        if (state.lockedMode === null) {
          const homeSolutions = inverseKinematicsAllSolutionsWithModes(
            normalizedW0,
            normalizedV0,
            0,
            0,
            0,
            null,
            true
          );
          const homeChoice = chooseSolutionClosestToReference(homeSolutions, [0, 0, 0], true);
          state.lockedMode = homeChoice.workingMode.slice();
        }

        if (state.lockMode) {
          selectedSolution = chooseSolutionByWorkingMode(
            currentSolutions,
            state.lockedMode,
            state.prevTheta,
            true
          );
        } else {
          selectedSolution = chooseSolutionClosestToReference(
            currentSolutions,
            state.prevTheta,
            true
          );
        }

        state.prevTheta = selectedSolution.theta.slice();
      } catch (err) {
        currentError = err && err.message ? err.message : String(err);
        currentSolutions = [];
      }

      updateInfoPanels();
      renderSolutionList();
      render();
    }

    function bindRangeAndNumber(rangeEl, numEl, getter, setter) {
      rangeEl.addEventListener("input", () => {
        const v = Number(rangeEl.value);
        numEl.value = v.toFixed(1);
        setter(v);
        recalc();
      });

      numEl.addEventListener("input", () => {
        let v = Number(numEl.value);
        if (!Number.isFinite(v)) return;
        v = clamp(v, Number(rangeEl.min), Number(rangeEl.max));
        rangeEl.value = v;
        numEl.value = v.toFixed(1);
        setter(v);
        recalc();
      });
    }

    bindRangeAndNumber(yawRange, yawNum, () => state.yaw, (v) => state.yaw = v);
    bindRangeAndNumber(pitchRange, pitchNum, () => state.pitch, (v) => state.pitch = v);
    bindRangeAndNumber(rollRange, rollNum, () => state.roll, (v) => state.roll = v);

    showGrid.addEventListener("change", recalc);
    showLabels.addEventListener("change", recalc);
    lockMode.addEventListener("change", () => {
      state.lockMode = lockMode.checked;
      recalc();
    });

    document.getElementById("btnHome").addEventListener("click", () => {
      setPose(0, 0, 0);
    });

    document.getElementById("btnSample").addEventListener("click", () => {
      setPose(defaultPose.yaw, defaultPose.pitch, defaultPose.roll);
    });

    document.getElementById("btnResetView").addEventListener("click", () => {
      state.cameraAzimuth = 35 * DEG;
      state.cameraElevation = 22 * DEG;
      state.cameraDistance = 6.8;
      render();
    });

    document.getElementById("btnFit").addEventListener("click", () => {
      state.cameraAzimuth = 35 * DEG;
      state.cameraElevation = 22 * DEG;
      state.cameraDistance = 6.8;
      render();
    });

    function setPose(yaw, pitch, roll) {
      state.yaw = yaw;
      state.pitch = pitch;
      state.roll = roll;
      yawRange.value = yaw;
      pitchRange.value = pitch;
      rollRange.value = roll;
      yawNum.value = formatFixed(yaw, 1);
      pitchNum.value = formatFixed(pitch, 1);
      rollNum.value = formatFixed(roll, 1);
      recalc();
    }

    canvas.addEventListener("pointerdown", (e) => {
      canvas.setPointerCapture(e.pointerId);
      canvas.dataset.dragging = "1";
      canvas.dataset.lastX = String(e.clientX);
      canvas.dataset.lastY = String(e.clientY);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (canvas.dataset.dragging !== "1") return;
      const lastX = Number(canvas.dataset.lastX);
      const lastY = Number(canvas.dataset.lastY);
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      canvas.dataset.lastX = String(e.clientX);
      canvas.dataset.lastY = String(e.clientY);
      state.cameraAzimuth += dx * 0.006;
      state.cameraElevation = clamp(state.cameraElevation + dy * 0.006, -1.4, 1.4);
      render();
    });

    canvas.addEventListener("pointerup", () => {
      canvas.dataset.dragging = "0";
    });

    canvas.addEventListener("pointerleave", () => {
      canvas.dataset.dragging = "0";
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = Math.exp(e.deltaY * 0.001);
      state.cameraDistance = clamp(state.cameraDistance * factor, 4.2, 12.5);
      render();
    }, { passive: false });

    window.addEventListener("resize", render);

    function init() {
      yawRange.value = state.yaw;
      pitchRange.value = state.pitch;
      rollRange.value = state.roll;
      yawNum.value = formatFixed(state.yaw, 1);
      pitchNum.value = formatFixed(state.pitch, 1);
      rollNum.value = formatFixed(state.roll, 1);

      const homeSolutions = inverseKinematicsAllSolutionsWithModes(
        normalizedW0,
        normalizedV0,
        0,
        0,
        0,
        null,
        true
      );
      const homeChoice = chooseSolutionClosestToReference(homeSolutions, [0, 0, 0], true);
      state.lockedMode = homeChoice.workingMode.slice();
      selectedSolution = homeChoice;
      state.prevTheta = homeChoice.theta.slice();
      updateInfoPanels();
      renderSolutionList();
      recalc();
    }

    init();
  </script>
</body>
</html>
